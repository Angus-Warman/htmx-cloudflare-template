"$schema" = "./node_modules/wrangler/config-schema.json"
name = "htmx-cloudflare-template"
compatibility_date = "2026-10-28"
main = "src/worker.ts"

[assets]
directory = "./src/public"

[[durable_objects.bindings]]
name = "SERVER"
class_name = "ServerObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ServerObject"]

# After making a change to this file, use `pnpm types`
