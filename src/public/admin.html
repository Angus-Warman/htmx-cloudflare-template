<!DOCTYPE html>
<html lang="en">

<head>
	<title>HTMX Cloudflare Template - Admin</title>

	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="color-scheme" content="dark" />

	<link rel="stylesheet" href="styles.css">

	<script src="/lib/htmx-2.0.8.js"></script>
	<script src="/lib/htmx-ws.js"></script>
</head>

<body hx-indicator="#loading-indicator">
	<nav hx-target="body" hx-push-url="true" hx-swap="transition:true">
		<a hx-get="/" href="/">Home</a>
		<a hx-get="/data" href="/data">Data Entry</a>
		<a hx-get="/chat" href="/chat">Live Chat</a>
		<a hx-get="/admin" href="/admin" class="active">Admin</a>
	</nav>

	<img id="loading-indicator" class="loading-indicator" src="/img/spinner.svg" alt="Loading">

	<main class="column">
		<h2>Admin</h2>

		<section class="card">
			<span>This is a password protected page, allowing raw SQL query access to any DurableObject.</span>
		</section>

		<section class="card">
			<span>Login status:</span> <span hx-get="/api/admin/login" hx-trigger="load" hx-swap="innerHTML">Pending</span>
		</section>

		<section>
			<form hx-post="/api/admin/sql" hx-target="#query-result" hx-swap="innerHTML">
				<label>
					Object name
					<input name="object-name" required value="global" />
				</label>

				<label>
					Query
					<textarea name="query" autocomplete="off" rows="5" required>SELECT name FROM sqlite_master WHERE type='table'</textarea>
				</label>

				<div class="right">
					<button type="submit">Send</button>
				</div>
			</form>
		</section>

		<section class="card">
			<h3>Result</h3>

			<pre id="query-result">
			</pre>
		</section>
	</main>
</body>

</html>
